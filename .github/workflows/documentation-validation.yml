name: Documentation baseline validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate-documentation-and-phase-1-handoff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate repository baseline
        run: python scripts/validate_repository.py
