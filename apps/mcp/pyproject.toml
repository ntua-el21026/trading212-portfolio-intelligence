[build-system]
requires = ["uv_build==0.12.7"]
build-backend = "uv_build"

[project]
name = "trading212-mcp"
version = "0.2.0"
description = "Bounded MCP composition root for Trading 212 Portfolio Intelligence"
requires-python = "==3.13.*"
dependencies = [
    "mcp==2.1.1",
    "trading212-analytics==0.2.0",
    "trading212-api-contracts==0.2.0",
    "trading212-application==0.2.0",
    "trading212-domain==0.2.0",
    "trading212-observability==0.2.0",
    "trading212-persistence==0.2.0",
    "trading212-security==0.2.0",
]

[tool.uv.sources]
trading212-analytics = { workspace = true }
trading212-api-contracts = { workspace = true }
trading212-application = { workspace = true }
trading212-domain = { workspace = true }
trading212-observability = { workspace = true }
trading212-persistence = { workspace = true }
trading212-security = { workspace = true }
