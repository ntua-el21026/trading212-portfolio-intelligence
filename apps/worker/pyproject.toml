[build-system]
requires = ["uv_build==0.12.7"]
build-backend = "uv_build"

[project]
name = "trading212-worker"
version = "0.1.0"
description = "Durable background worker for Trading 212 Portfolio Intelligence"
requires-python = "==3.13.*"
dependencies = [
    "celery[redis]==5.6.3",
    "trading212-analytics==0.1.0",
    "trading212-application==0.1.0",
    "trading212-domain==0.1.0",
    "trading212-observability==0.1.0",
    "trading212-persistence==0.1.0",
    "trading212-security==0.1.0",
    "trading212-provider==0.1.0",
    "trading212-reference-data==0.1.0",
]

[tool.uv.sources]
trading212-analytics = { workspace = true }
trading212-application = { workspace = true }
trading212-domain = { workspace = true }
trading212-observability = { workspace = true }
trading212-persistence = { workspace = true }
trading212-security = { workspace = true }
trading212-provider = { workspace = true }
trading212-reference-data = { workspace = true }
