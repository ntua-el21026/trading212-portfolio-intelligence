services:
  postgres:
    build:
      context: .
      dockerfile: infrastructure/docker/postgres.Dockerfile
    image: t212pi-postgres:18.6-hardened
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    labels:
      com.trading212.storage-role: authoritative-system-of-record
    stop_grace_period: 30s

  # Redis is optional, non-authoritative coordination/cache/job infrastructure.
  # Canonical financial facts, checkpoints, and evidence remain in PostgreSQL.
  redis:
    build:
      context: .
      dockerfile: infrastructure/docker/redis.Dockerfile
    image: t212pi-redis:8.10.1-hardened
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    labels:
      com.trading212.storage-role: non-authoritative-coordination-only
    stop_grace_period: 10s

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@postgres:5432/${POSTGRES_DB:-portfolio}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    command: ["python", "-m", "trading212_worker.seed"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@postgres:5432/${POSTGRES_DB:-portfolio}
      T212PI_ENVIRONMENT: local
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@postgres:5432/${POSTGRES_DB:-portfolio}
      CELERY_BROKER_URL: redis://redis:6379/0
      T212PI_ENVIRONMENT: local
      T212PI_LOCAL_SYNTHETIC_AUTH_ENABLED: "true"
      T212PI_COOKIE_SECURE: "false"
      T212PI_ALLOWED_ORIGINS: '["http://localhost:${WEB_PORT:-3000}"]'
      T212PI_ALLOWED_HOSTS: '["localhost","127.0.0.1","api"]'
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@postgres:5432/${POSTGRES_DB:-portfolio}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      T212PI_ENVIRONMENT: local
      T212PI_RATE_COORDINATION_URL: redis://redis:6379/2
      T212PI_WORKER_PROVIDER: synthetic
      T212PI_WORKER_EAGER: "false"
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  mcp:
    build:
      context: .
      dockerfile: infrastructure/docker/mcp.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@postgres:5432/${POSTGRES_DB:-portfolio}
      T212PI_ENVIRONMENT: local
      T212PI_LOCAL_SYNTHETIC_AUTH_ENABLED: "true"
      T212PI_ALLOWED_ORIGINS: '["http://localhost:${WEB_PORT:-3000}"]'
      T212PI_ALLOWED_HOSTS: '["localhost","127.0.0.1","mcp"]'
      T212PI_MCP_HOST: 0.0.0.0
      T212PI_MCP_PORT: "8001"
      T212PI_MCP_ALLOW_NON_LOOPBACK_LOCAL_SYNTHETIC_BIND: "true"
    ports:
      - "127.0.0.1:${MCP_PORT:-8001}:8001"
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      T212PI_API_BASE_URL: http://api:8000
      T212PI_LOCAL_API_AUTH_ENABLED: "1"
      T212PI_WEB_ENVIRONMENT: local
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres-data:
