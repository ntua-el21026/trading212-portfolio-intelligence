[build-system]
requires = ["uv_build==0.12.7"]
build-backend = "uv_build"

[project]
name = "trading212-observability"
version = "0.2.0"
description = "Structured logging, metrics, and tracing adapters"
requires-python = "==3.13.*"
dependencies = [
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "prometheus-client==0.26.0",
    "structlog==26.1.0",
    "trading212-security==0.2.0",
]

[tool.uv.sources]
trading212-security = { workspace = true }
